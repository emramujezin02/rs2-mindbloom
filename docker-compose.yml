name: mindbloom

services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mindbloom-sql-server
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${SQL_SERVER_PASSWORD}"

    ports:
      - "${SQL_SERVER_PORT:-1433}:1433"

    volumes:
      - mindbloom-sql-data:/var/opt/mssql

    networks:
      - mindbloom-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${SQL_SERVER_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s


  rabbitmq:
    image: rabbitmq:3-management
    container_name: mindbloom-rabbitmq
    hostname: rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USERNAME}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
      RABBITMQ_DEFAULT_VHOST: "${RABBITMQ_VIRTUAL_HOST:-/}"

    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"

    volumes:
      - mindbloom-rabbitmq-data:/var/lib/rabbitmq

    networks:
      - mindbloom-network

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  api:
    container_name: mindbloom-api
    restart: unless-stopped

    build:
      context: .
      dockerfile: src/MindBloom.API/Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      DOTNET_ENVIRONMENT: "${DOTNET_ENVIRONMENT:-Production}"
      ASPNETCORE_URLS: "http://+:8080"

      DB_CONNECTION: "Server=sql-server,1433;Database=${SQL_SERVER_DATABASE};User Id=sa;Password=${SQL_SERVER_PASSWORD};TrustServerCertificate=True;Encrypt=False;"
      ConnectionStrings__DefaultConnection: "Server=sql-server,1433;Database=${SQL_SERVER_DATABASE};User Id=sa;Password=${SQL_SERVER_PASSWORD};TrustServerCertificate=True;Encrypt=False;"

      JWT_KEY: "${JWT_SECRET}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_ISSUER: "${JWT_ISSUER}"
      JWT_AUDIENCE: "${JWT_AUDIENCE}"
      JWT_EXPIRATION_MINUTES: "${JWT_EXPIRATION_MINUTES}"

      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: "${RABBITMQ_USERNAME}"
      RABBITMQ_USERNAME: "${RABBITMQ_USERNAME}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      RABBITMQ_VIRTUAL_HOST: "${RABBITMQ_VIRTUAL_HOST}"

      RABBITMQ_CLIENT_NAME: "${RABBITMQ_CLIENT_NAME}"
      RABBITMQ_NOTIFICATION_EXCHANGE: "${RABBITMQ_NOTIFICATION_EXCHANGE}"
      RABBITMQ_EXCHANGE: "${RABBITMQ_NOTIFICATION_EXCHANGE}"
      RABBITMQ_EMAIL_QUEUE: "${RABBITMQ_EMAIL_QUEUE}"
      RABBITMQ_EMAIL_ROUTING_KEY: "${RABBITMQ_EMAIL_ROUTING_KEY}"

      RABBITMQ_AUTOMATIC_RECOVERY: "${RABBITMQ_AUTOMATIC_RECOVERY}"
      RABBITMQ_RECOVERY_INTERVAL_SECONDS: "${RABBITMQ_RECOVERY_INTERVAL_SECONDS}"
      RABBITMQ_HEARTBEAT_SECONDS: "${RABBITMQ_HEARTBEAT_SECONDS}"

      RABBITMQ_RETRY_EXCHANGE: "${RABBITMQ_RETRY_EXCHANGE}"
      RABBITMQ_DEAD_LETTER_EXCHANGE: "${RABBITMQ_DEAD_LETTER_EXCHANGE}"
      RABBITMQ_EMAIL_DEAD_LETTER_QUEUE: "${RABBITMQ_EMAIL_DEAD_LETTER_QUEUE}"
      RABBITMQ_EMAIL_DEAD_LETTER_ROUTING_KEY: "${RABBITMQ_EMAIL_DEAD_LETTER_ROUTING_KEY}"
      RABBITMQ_MAXIMUM_RETRY_COUNT: "${RABBITMQ_MAXIMUM_RETRY_COUNT}"

RABBITMQ_INTEGRATION_EVENT_QUEUE: "${RABBITMQ_INTEGRATION_EVENT_QUEUE}"
RABBITMQ_INTEGRATION_EVENT_DEAD_LETTER_QUEUE: "${RABBITMQ_INTEGRATION_EVENT_DEAD_LETTER_QUEUE}"
RABBITMQ_INTEGRATION_EVENT_DEAD_LETTER_ROUTING_KEY: "${RABBITMQ_INTEGRATION_EVENT_DEAD_LETTER_ROUTING_KEY}"

      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"

      EMAIL_USERNAME: "${EMAIL_USERNAME}"
      EMAIL_PASSWORD: "${EMAIL_PASSWORD}"

    ports:
      - "${API_PORT:-8080}:8080"

    depends_on:
      sql-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - mindbloom-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:8080/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s


  notifications-worker:
    container_name: mindbloom-notifications-worker
    restart: unless-stopped

    build:
      context: .
      dockerfile: src/MindBloom.NotificationsWorker/Dockerfile

    environment:
      DOTNET_ENVIRONMENT: "${DOTNET_ENVIRONMENT:-Production}"

      DB_CONNECTION: "Server=sql-server,1433;Database=${SQL_SERVER_DATABASE};User Id=sa;Password=${SQL_SERVER_PASSWORD};TrustServerCertificate=True;Encrypt=False;"
      ConnectionStrings__DefaultConnection: "Server=sql-server,1433;Database=${SQL_SERVER_DATABASE};User Id=sa;Password=${SQL_SERVER_PASSWORD};TrustServerCertificate=True;Encrypt=False;"

           RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: "${RABBITMQ_USERNAME}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      RABBITMQ_VIRTUAL_HOST: "${RABBITMQ_VIRTUAL_HOST}"

      RABBITMQ_CLIENT_NAME: "${RABBITMQ_CLIENT_NAME}"
      RABBITMQ_WORKER_CLIENT_NAME: "${RABBITMQ_WORKER_CLIENT_NAME}"

      RABBITMQ_NOTIFICATION_EXCHANGE: "${RABBITMQ_NOTIFICATION_EXCHANGE}"
      RABBITMQ_EMAIL_QUEUE: "${RABBITMQ_EMAIL_QUEUE}"
      RABBITMQ_EMAIL_ROUTING_KEY: "${RABBITMQ_EMAIL_ROUTING_KEY}"

      RABBITMQ_RETRY_EXCHANGE: "${RABBITMQ_RETRY_EXCHANGE}"
      RABBITMQ_DEAD_LETTER_EXCHANGE: "${RABBITMQ_DEAD_LETTER_EXCHANGE}"
      RABBITMQ_EMAIL_DEAD_LETTER_QUEUE: "${RABBITMQ_EMAIL_DEAD_LETTER_QUEUE}"
      RABBITMQ_EMAIL_DEAD_LETTER_ROUTING_KEY: "${RABBITMQ_EMAIL_DEAD_LETTER_ROUTING_KEY}"

      RABBITMQ_PREFETCH_COUNT: "${RABBITMQ_PREFETCH_COUNT}"
      RABBITMQ_MAXIMUM_RETRY_COUNT: "${RABBITMQ_MAXIMUM_RETRY_COUNT}"

      RABBITMQ_AUTOMATIC_RECOVERY: "${RABBITMQ_AUTOMATIC_RECOVERY}"
      RABBITMQ_RECOVERY_INTERVAL_SECONDS: "${RABBITMQ_RECOVERY_INTERVAL_SECONDS}"
      RABBITMQ_HEARTBEAT_SECONDS: "${RABBITMQ_HEARTBEAT_SECONDS}"

      RABBITMQ_CONNECTION_RETRY_COUNT: "${RABBITMQ_CONNECTION_RETRY_COUNT}"
      RABBITMQ_CONNECTION_RETRY_DELAY_SECONDS: "${RABBITMQ_CONNECTION_RETRY_DELAY_SECONDS}"

      EMAIL_USERNAME: "${EMAIL_USERNAME}"
      EMAIL_PASSWORD: "${EMAIL_PASSWORD}"

    depends_on:
      sql-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - mindbloom-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -r /proc/1/cmdline && grep -qa 'MindBloom.NotificationsWorker.dll' /proc/1/cmdline"
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s


volumes:
  mindbloom-sql-data:
    name: mindbloom-sql-data

  mindbloom-rabbitmq-data:
    name: mindbloom-rabbitmq-data


networks:
  mindbloom-network:
    name: mindbloom-network
    driver: bridge